<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e1311">
<title>Caixa · Insumos da oficina</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1311;--surface:#141b18;--surface-2:#1a231f;--line:#24302a;--line-2:#2f3d36;
  --ink:#e8efe9;--soft:#b9c7bf;--muted:#8fa197;--accent:#7cc34b;--accent-ink:#0e1311;
  --ok:#6fd08f;--warn:#f2c14e;--bad:#f07a6a;--info:#7fb6f2;
  --f-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-display);-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.top img{height:22px;width:auto;display:block}
.top span{color:var(--muted);font-size:12.5px}
.box{font:800 46px/1 var(--f-display);letter-spacing:-.02em;margin:0}
.where{color:var(--muted);font-size:13.5px;margin:6px 0 12px}
.item{font:700 20px/1.3 var(--f-display);margin:0 0 16px}
.st{border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid}
.st h2{margin:0 0 4px;font:800 19px/1.25 var(--f-display)}
.st p{margin:0;font-size:14px;color:var(--soft)}
.st.ok{background:rgba(111,208,143,.1);border-color:rgba(111,208,143,.45)} .st.ok h2{color:var(--ok)}
.st.no{background:rgba(242,193,78,.1);border-color:rgba(242,193,78,.45)} .st.no h2{color:var(--warn)}
.st.na{background:var(--surface);border-color:var(--line)} .st.na h2{color:var(--soft)}
.sa{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.sa:first-of-type{margin-top:10px}
.sa i{font-style:normal;font-weight:700} .sa .atr{color:var(--bad)} .sa .com{color:var(--warn)} .sa .sep{color:var(--info)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font:700 13px var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
label{display:block;font-weight:600;font-size:13.5px;color:var(--soft);margin:0 0 6px}
select,textarea,input{width:100%;font:600 16px var(--f-display);color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:12px}
textarea{font-weight:400;min-height:70px;resize:vertical}
select:focus,textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
.me{display:flex;align-items:center;justify-content:space-between;gap:10px}
.me b{font-size:16px}
.link{background:none;border:0;color:var(--accent);font:700 14px var(--f-display);padding:6px 0;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;padding:16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:800 17px var(--f-display);cursor:pointer}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.done{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:14px;border-radius:12px;background:rgba(111,208,143,.12);border:1px solid rgba(111,208,143,.45)}
.done b{color:var(--ok)}
.err{margin-top:12px;color:var(--bad);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0}
.row+.row{border-top:1px solid var(--line)}
.row b{font-weight:600;color:var(--muted);font-size:13px}
.row code{font:600 15px var(--f-mono);color:var(--accent)}
.row button{border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:4px 10px;font:700 12px var(--f-display);cursor:pointer}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;color:var(--muted);font-size:12.5px}
.foot a{color:var(--ink);font-weight:700}
.find{display:flex;gap:8px;margin-top:14px} .find input{text-transform:uppercase} .find .btn{margin:0;width:auto;padding:0 18px}
.hide{display:none!important}
</style>
</head>
<body>
<main id="app" aria-live="polite"><p style="color:#8fa197">Carregando…</p></main>
<script>
(() => {
  "use strict";
  // Formulário "Solicitação de insumos – Oficina" (Google Forms do PCM)
  const FORM = 'https://docs.google.com/forms/d/e/1FAIpQLScvJle24UIwQQwB9qyMzLgNBn5CMMf3Rp1fIduBLiyWsIQR4A/formResponse';
  const F_TEC = 'entry.1445548810', F_CX = 'entry.1237280880', F_OBS = 'entry.26440985';
  const PAINEL = 'https://claude.ai/artifact/LuF4jjqYAHuSa5naxXkDvu';
  const TECNICOS = ['Andrey','Bruno','Daniel G.','Dornelles','Felipe','Filipe','Guilherme','Jessiel','Jorison','Juan','Luciano','Luiz','Marcelo','Nicolas','Plentz','Valdemir'];

  const app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(_) { return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(_) {} }
  };
  const boxFromUrl = () => {
    const raw = decodeURIComponent((location.hash || '').replace(/^#/, '') || (location.search || '').replace(/^\?(c=)?/, ''));
    const m = /^([abc])\s*0*(\d{1,3})$/i.exec(raw.trim());
    return m ? m[1].toUpperCase() + m[2] : (raw ? raw.toUpperCase() : null);
  };
  const qn = v => { const n = +v; return isFinite(n) ? String(n).replace('.', ',') : esc(v); };
  const fmt = d => d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}) + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});

  let DATA = null, sending = false, editMe = false, justSent = null;

  function top(){ return `<div class="top"><img src="logo.png" alt="Carmak"><span>Insumos da oficina</span></div>`; }

  function finder(msg){
    app.innerHTML = `${top()}<p class="item" style="margin-top:8px">${esc(msg)}</p>
      <form class="find" id="find"><input id="q" placeholder="Ex.: A12" autocomplete="off" aria-label="Número da caixa"><button class="btn" type="submit">Abrir</button></form>
      <div class="foot"><span>${DATA ? 'Pedidos atualizados em ' + esc(DATA.at) : ''}</span><a href="${PAINEL}" target="_blank" rel="noopener">Abrir o painel 3D</a></div>`;
    document.getElementById('find').addEventListener('submit', e => { e.preventDefault(); const v = document.getElementById('q').value.trim(); if (v) location.hash = v.toUpperCase(); });
  }

  function render(){
    const k = boxFromUrl();
    if (!DATA) return;
    if (!k) return finder('Digite o número da caixa que está na etiqueta.');
    const it = DATA.items[k];
    if (!it) return finder(`Caixa ${k} não encontrada. Confira o número da etiqueta.`);

    const me = store.get('cx.tecnico');
    const asked = +store.get('cx.pedido.' + k) || 0;
    const askedRecently = asked && (Date.now() - asked) < 3 * 24 * 3600e3;

    let st = '';
    if (it.vz) {
      st = `<div class="st na"><h2>Caixa vazia</h2><p>Esta caixa não tem item na lista.</p></div>`;
    } else if (it.pend.length) {
      st = `<div class="st ok"><h2>Já tem pedido aberto</h2><p>Não precisa solicitar. O item já está pedido.</p>` +
        it.pend.map(r => `<div class="sa"><span>SA ${esc(r.sa)} · ${esc(r.dt)} · ${qn(r.q)} un</span><i class="${esc(r.cat)}">${esc(r.st)}</i></div>`).join('') + `</div>`;
    } else {
      const ult = it.ult ? `Último pedido entregue: SA ${esc(it.ult.sa)}, de ${esc(it.ult.dt)}.` : 'Nenhum pedido deste item nos últimos 3 meses.';
      const who = me && !editMe
        ? `<div class="me"><span>Você é <b>${esc(me)}</b></span><button class="link" type="button" data-act="trocar">trocar</button></div>`
        : `<label for="tec">Quem é você?</label><select id="tec"><option value="">Escolha seu nome</option>${TECNICOS.map(t => `<option${t === me ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
      st = `<div class="st no"><h2>Sem pedido aberto</h2><p>${ult}</p></div>
        <div class="card" id="req">
          ${justSent === k ? `<div class="done" style="margin:0 0 12px"><span>✓</span><span><b>Pedido enviado ao PCM.</b> Não precisa avisar de novo.</span></div>`
            : askedRecently ? `<div class="done" style="margin:0 0 12px"><span>✓</span><span><b>Você já solicitou</b> em ${esc(fmt(new Date(asked)))}.</span></div>` : ''}
          ${who}
          <div style="margin-top:12px"><label for="obs">Observação (opcional)</label><textarea id="obs" placeholder="Ex.: acabou, só tem 2"></textarea></div>
          <button class="btn" type="button" data-act="pedir" ${(me && !editMe) ? '' : 'disabled'}>${askedRecently ? 'Solicitar de novo' : 'Solicitar item'}</button>
          <div id="msg"></div>
        </div>`;
    }

    const rows = [];
    if (it.c) rows.push(`<div class="row"><b>Código TOTVS</b><span><code>${esc(it.c)}</code> <button type="button" data-cp="${esc(it.c)}">copiar</button></span></div>`);
    else if (!it.vz) rows.push(`<div class="row"><b>Código TOTVS</b><span>sem código (N/A)</span></div>`);
    if (it.pn) rows.push(`<div class="row"><b>Part Number</b><span>${esc(it.pn)}</span></div>`);
    if (it.lm) rows.push(`<div class="row"><b>Local no estoque</b><span>${esc(it.lm)}</span></div>`);
    if (it.mn && it.mn !== 'N/A') rows.push(`<div class="row"><b>Quantidade mínima</b><span>${esc(it.mn)}</span></div>`);

    app.innerHTML = `${top()}
      <h1 class="box">${esc(k)}</h1>
      <p class="where">${esc(it.w)}</p>
      <p class="item">${esc(it.vz ? 'Caixa vazia' : it.d)}</p>
      ${st}
      ${rows.length ? `<div class="card">${rows.join('')}</div>` : ''}
      <div class="foot"><span>Pedidos atualizados em ${esc(DATA.at)}</span><a href="${PAINEL}" target="_blank" rel="noopener">Abrir o painel 3D</a></div>`;
    document.title = `${k} · Insumos da oficina`;
  }

  async function pedir(){
    const k = boxFromUrl(), it = DATA.items[k], me = store.get('cx.tecnico');
    if (!it || !me || sending) return;
    const obsEl = document.getElementById('obs'), msg = document.getElementById('msg'), btn = document.querySelector('[data-act="pedir"]');
    const nota = (obsEl && obsEl.value.trim()) || '';
    const obs = `Item: ${it.d}${it.c ? ' · cód. ' + it.c : ''}${nota ? ' · Obs.: ' + nota : ''}`;
    const body = new URLSearchParams(); body.set(F_TEC, me); body.set(F_CX, k); body.set(F_OBS, obs);
    sending = true; btn.disabled = true; btn.textContent = 'Enviando…'; msg.innerHTML = '';
    try {
      await fetch(FORM, { method: 'POST', mode: 'no-cors', body });
      store.set('cx.pedido.' + k, String(Date.now()));
      justSent = k; render();
      const top = document.getElementById('req'); if (top) top.scrollIntoView({ block: 'center', behavior: 'smooth' });
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Solicitar item';
      msg.innerHTML = `<p class="err">Não consegui enviar. Confira a internet do celular e tente de novo.</p>`;
    } finally { sending = false; }
  }

  app.addEventListener('change', e => {
    if (e.target.id === 'tec') { if (e.target.value) { store.set('cx.tecnico', e.target.value); editMe = false; render(); } }
  });
  app.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'), cp = e.target.closest('[data-cp]');
    if (a && a.dataset.act === 'trocar') { editMe = true; render(); }
    if (a && a.dataset.act === 'pedir') pedir();
    if (cp) { try { navigator.clipboard.writeText(cp.dataset.cp); } catch(_) {} cp.textContent = 'copiado'; setTimeout(() => cp.textContent = 'copiar', 1400); }
  });
  window.addEventListener('hashchange', () => { editMe = false; justSent = null; render(); });

  const FACE = { A: 'Face A', B: 'Face B', C: 'Centro (caixas C)' };
  // data.json compacto: caixa -> [descrição, código, PN, local, mínimo, fileira, posição, vazia, pedidos abertos, último entregue]
  const unpack = d => { const items = {}; for (const [k, a] of Object.entries(d.items)) items[k] = {
      d: a[0], c: a[1], pn: a[2], lm: a[3], mn: a[4], w: a[5] ? `${FACE[k[0]]} · fileira ${a[5]}, posição ${a[6]}` : FACE[k[0]], vz: !!a[7],
      pend: (a[8] || []).map(p => ({ sa: p[0], dt: p[1], q: p[2], cat: p[3], st: p[4] })), ult: a[9] ? { sa: a[9][0], dt: a[9][1] } : null };
    return { at: d.at, items }; };
  fetch('data.json', { cache: 'no-cache' }).then(r => r.json()).then(d => { DATA = unpack(d); render(); })
    .catch(() => { app.innerHTML = `${top()}<p class="err">Não consegui carregar a lista de caixas. Tente de novo.</p>`; });
})();
</script>
</body>
</html>
